[workspace]
members = [
    "crates/open-print-pdf-application",
    "crates/open-print-pdf-core",
    "crates/open-print-pdf-conversion-ghostscript",
    "crates/open-print-pdf-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/project-guts/pdfx1a-convert"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
lopdf = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true
