name: Build Microsoft Store MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-package:
    name: Windows 11 x64 Store package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Prepare bundled Ghostscript and source archive
        id: ghostscript
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/prepare-ghostscript-windows.ps1 -DownloadSource
      - name: Expose staged Ghostscript to integration tests
        shell: pwsh
        run: Split-Path '${{ steps.ghostscript.outputs.ghostscript_exe }}' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check and test source
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build Store submission package
        id: msix
        shell: pwsh
        run: ./scripts/build-store-msix.ps1
      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Upload private Store submission artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: open-print-pdf-store-submission-${{ steps.msix.outputs.package_version }}
          path: |
            ${{ steps.msix.outputs.msixupload }}
            ${{ steps.msix.outputs.msix }}
            ${{ steps.msix.outputs.checksums }}
            ${{ steps.ghostscript.outputs.source_archive }}
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
